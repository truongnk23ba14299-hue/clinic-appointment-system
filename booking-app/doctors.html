<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đội ngũ bác sĩ — MedBooking</title>
<meta name="description" content="Danh sách đội ngũ bác sĩ chuyên khoa giàu kinh nghiệm tại MedBooking. Tìm kiếm theo tên hoặc lọc theo chuyên khoa để chọn bác sĩ phù hợp.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-icon">M</span>
      MedBooking
      <span class="tag">Phòng khám đa khoa</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Trang chủ</a>
      <a href="departments.html">Phòng ban</a>
      <a href="doctors.html" class="active">Bác sĩ</a>
      <a href="booking.html">Đặt lịch</a>
      <a href="appointments.html">Lịch của tôi</a>
    </nav>
    <a href="booking.html" class="btn btn-primary">Đặt lịch ngay</a>
  </div>
</header>

<main>
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2>Đội ngũ bác sĩ chuyên khoa</h2>
          <p id="resultCount">Đang tải danh sách bác sĩ...</p>
        </div>
      </div>

      <div class="search-box">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên bác sĩ hoặc chuyên môn...">
        <button type="button" class="clear-btn" id="clearSearch" aria-label="Xóa tìm kiếm">✕</button>
      </div>

      <div class="pill-row" id="specialtyPills" style="margin-bottom:32px;"></div>
      <div class="doctor-grid" id="doctorGrid"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="brand-icon">M</span> MedBooking
      </div>
      <nav class="footer-nav">
        <a href="index.html">Trang chủ</a>
        <a href="departments.html">Phòng ban</a>
        <a href="doctors.html">Bác sĩ</a>
        <a href="booking.html">Đặt lịch</a>
        <a href="appointments.html">Lịch của tôi</a>
      </nav>
    </div>
    <div class="footer-bottom">
      <span>© 2026 MedBooking. Tất cả quyền được bảo lưu.</span>
      <span>Hotline Cấp cứu: <strong>0336 578 262</strong></span>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  let activeSpecialty = params.get("specialty") || "all";
  let searchTerm = "";

  const pillRow = document.getElementById("specialtyPills");
  const grid = document.getElementById("doctorGrid");
  const resultCount = document.getElementById("resultCount");
  const searchInput = document.getElementById("searchInput");
  const clearSearchBtn = document.getElementById("clearSearch");

  function renderPills() {
    pillRow.innerHTML = "";
    const allPill = document.createElement("button");
    allPill.className = "pill" + (activeSpecialty === "all" ? " active" : "");
    allPill.textContent = "Tất cả chuyên khoa";
    allPill.onclick = () => { activeSpecialty = "all"; renderPills(); renderDoctors(); };
    pillRow.appendChild(allPill);

    SPECIALTIES.forEach(s => {
      const p = document.createElement("button");
      p.className = "pill" + (activeSpecialty === s ? " active" : "");
      p.textContent = s;
      p.onclick = () => { activeSpecialty = s; renderPills(); renderDoctors(); };
      pillRow.appendChild(p);
    });
  }

  function normalize(str) {
    return str
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d");
  }

  function renderDoctors() {
    let list = activeSpecialty === "all"
      ? DOCTORS
      : DOCTORS.filter(d => d.specialty === activeSpecialty);

    if (searchTerm.trim() !== "") {
      const term = normalize(searchTerm.trim());
      list = list.filter(d => normalize(d.name).includes(term) || normalize(d.note).includes(term));
    }

    resultCount.textContent = `Hiển thị ${list.length} bác sĩ ${activeSpecialty !== 'all' ? 'khoa ' + activeSpecialty : ''}`;
    grid.innerHTML = "";

    list.forEach(d => {
      const card = document.createElement("div");
      card.className = "stub";
      card.innerHTML = `
        <div class="stub-top">
          <a href="doctor.html?id=${d.id}" class="stub-avatar" style="--avatar-bg: ${d.color}" title="Xem thông tin ${d.name}">${d.initials}</a>
          <div class="stub-info">
            <h3><a href="doctor.html?id=${d.id}" class="doctor-link">${d.name}</a></h3>
            <span class="badge">${d.specialty}</span>
          </div>
        </div>
        <div class="stub-meta">
          <span class="stub-rating">★ ${d.rating}</span>
          <span>(${d.reviews} đánh giá)</span>
          <span>·</span>
          <span>${d.years} năm kinh nghiệm</span>
        </div>
        <div class="stub-bottom">
          <span class="note">${d.note}</span>
          <div class="stub-actions">
            <a class="btn btn-outline btn-sm" style="flex:1;" href="doctor.html?id=${d.id}">Xem thông tin</a>
            <a class="btn btn-primary btn-sm" style="flex:1;" href="booking.html?doctor=${d.id}">Đặt lịch</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    if (list.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <div class="empty-state-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </div>
          <h3>Không tìm thấy bác sĩ phù hợp</h3>
          <p>Thử tìm kiếm với từ khóa khác hoặc chọn chuyên khoa khác.</p>
          <button class="btn btn-outline" id="resetFilterBtn">Xóa bộ lọc & Tìm lại</button>
        </div>
      `;
      document.getElementById("resetFilterBtn").onclick = () => {
        searchTerm = "";
        searchInput.value = "";
        clearSearchBtn.style.display = "none";
        activeSpecialty = "all";
        renderPills();
        renderDoctors();
      };
    }
  }

  searchInput.addEventListener("input", (e) => {
    searchTerm = e.target.value;
    clearSearchBtn.style.display = searchTerm.length > 0 ? "block" : "none";
    renderDoctors();
  });

  clearSearchBtn.addEventListener("click", () => {
    searchTerm = "";
    searchInput.value = "";
    clearSearchBtn.style.display = "none";
    renderDoctors();
  });

  renderPills();
  renderDoctors();
</script>
</body>
</html>
